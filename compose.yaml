name: servicio-social

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ServicioSocial}
      POSTGRES_USER: ${DB_USER:-Angel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: servicio-social-api:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_SSL: ${DB_SSL:-false}
      DB_NAME: ${DB_NAME:-ServicioSocial}
      DB_USER: ${DB_USER:-Angel}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en .env}
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET en .env}
      FRONTEND_URL: ${FRONTEND_URL:?Configura FRONTEND_URL en .env}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      INSTITUTIONAL_DOMAIN: ${INSTITUTIONAL_DOMAIN:-culiacan.tecnm.mx}
      INSTITUTION_NAME: ${INSTITUTION_NAME:-Tecnológico Nacional de México - Campus Culiacán}
      RESEND_API_KEY: ${RESEND_API_KEY:?Configura RESEND_API_KEY en .env}
      MAIL_FROM: ${MAIL_FROM:?Configura MAIL_FROM con un dominio verificado}
      HOURS_REQUIRED: ${HOURS_REQUIRED:-480}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - backend

  correo:
    image: axllent/mailpit:v1.27.10
    profiles: [dev]
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - backend

volumes:
  datos:

networks:
  backend:
    driver: bridge
