name: serviciosocial

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ServicioSocial}
      POSTGRES_USER: ${DB_USER:-Angel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [data]

  api:
    image: ${BACKEND_IMAGE:-serviciosocial-api:latest}
    build: ./BackEnd
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ServicioSocial}
      DB_USER: ${DB_USER:-Angel}
      DB_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?Configura SESSION_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:?Configura el origen HTTPS}
      TRUST_PROXY_HOPS: 2
      INSTITUTIONAL_DOMAIN: culiacan.tecnm.mx
      RESEND_API_KEY: ${RESEND_API_KEY:?Configura RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM:-onboarding@resend.dev}
      HOURS_REQUIRED: 480
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, '-e', 'fetch("http://127.0.0.1:3000/api/salud").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [data, web]
    stop_grace_period: 40s

  front:
    image: ${FRONTEND_IMAGE:-serviciosocial-front:latest}
    build: ./FrontEnd
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    networks: [web]

volumes:
  postgres_data:

networks:
  data:
    internal: true
  web:
